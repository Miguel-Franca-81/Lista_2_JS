<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identificador de Triângulos</title>
</head>
<body>

<h2>Identificador de Triângulos</h2>

<p>Digite os comprimentos dos três lados do triângulo:</p>

<input type="number" id="lado1" placeholder="Lado 1">
<input type="number" id="lado2" placeholder="Lado 2">
<input type="number" id="lado3" placeholder="Lado 3">

<button onclick="identificarTriangulo()">Verificar</button>

<p id="resultado"></p>

<script>
function identificarTriangulo() {
    // Obter os valores dos lados do triângulo
    const lado1 = parseFloat(document.getElementById("lado1").value);
    const lado2 = parseFloat(document.getElementById("lado2").value);
    const lado3 = parseFloat(document.getElementById("lado3").value);
    
    // Verificar se os valores inseridos formam um triângulo
    if (lado1 + lado2 > lado3 && lado1 + lado3 > lado2 && lado2 + lado3 > lado1) {
        if (lado1 === lado2 && lado2 === lado3) {
            document.getElementById("resultado").innerText = "O triângulo é equilátero.";
        } else if (lado1 === lado2 || lado1 === lado3 || lado2 === lado3) {
            document.getElementById("resultado").innerText = "O triângulo é isósceles.";
        } else {
            document.getElementById("resultado").innerText = "O triângulo é escaleno.";
        }
    } else {
        document.getElementById("resultado").innerText = "Os comprimentos dos lados não formam um triângulo válido.";
    
    }
}
</script>
</body>
</html>
