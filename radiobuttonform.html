<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário com Validação em JavaScript</title>
<style>
    .error {
        color: red;
    }
</style>
</head>
<body>

<h2>Formulário com Validação em JavaScript</h2>
<form id="myForm">
    <div>
        <label>Escolha uma opção:</label><br>
        <input type="radio" id="opcao1" name="opcao" value="opcao1">
        <label for="opcao1">Opção 1</label><br>
        <input type="radio" id="opcao2" name="opcao" value="opcao2">
        <label for="opcao2">Opção 2</label><br>
        <input type="radio" id="opcao3" name="opcao" value="opcao3">
        <label for="opcao3">Opção 3</label><br>
        <span id="opcaoError" class="error"></span>
    </div>
    <br>
    <button type="button" onclick="validateForm()">Enviar</button>
</form>

<script>
    function validateForm() {
        const opcaoError = document.getElementById('opcaoError');
        const opcoes = document.getElementsByName('opcao');
        let valid = false;
    
        for (const opcao of opcoes) {
            if (opcao.checked) {
                valid = true;
                break;
            }
        }
    
        if (!valid) {
            opcaoError.textContent = 'Por favor, selecione uma opção.';
        } else {
            opcaoError.textContent = '';
            // Aqui você pode enviar o formulário
            alert('Formulário válido, enviado com sucesso!');
            // Se quiser enviar o formulário, use:
            // document.getElementById('myForm').submit();
        }
    }
</script>
    
</body>
</html>
